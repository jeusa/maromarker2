name: Build AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            build_requirements.txt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            ccache \
            desktop-file-utils \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r build_requirements.txt

      - name: Cache Nuitka and ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-linux-${{ hashFiles('requirements.txt', 'build_requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            nuitka-linux-${{ hashFiles('requirements.txt', 'build_requirements.txt') }}-
            nuitka-linux-

      - name: Build AppImage
        run: bash scripts/build_appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: MarOMarker2-x86_64
          path: dist/MarOMarker2-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14